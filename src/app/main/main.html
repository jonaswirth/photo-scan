<div id="preview">
    @if(!processingService.processedImages.length){
    <p>No preview available start by uploading an image or take a photo with your camera.</p>
    }
    @else{
    <p>preview not implemented</p>
    <p>{{currentIndex}} / {{processingService.processedImages.length}}</p>
    }

</div>
<div id="buttons">
    <button matButton="outlined">
        <mat-icon aria-label="Upload image" fontIcon="upload"></mat-icon>
        Upload
    </button>
    <button routerLink="/camera" matButton="outlined">
        <mat-icon aria-label="Take photo" fontIcon="camera_alt"></mat-icon>
        Take photo
    </button>
    <button routerLink="/test" matButton="outlined">
        Test
    </button>
</div>
